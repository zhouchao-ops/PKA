flux_path: "black-forest-labs/FLUX.1-dev"
dtype: "bfloat16"

env:
  CONDITION_TEMPORAL: 0
  DRIFT_MEAN: 0.0
  DRIFT_STD: 1.0
  TRAIN: true

model:
  union_cond_attn: true
  add_cond_attn: false
  latent_lora: false
  spatial_condition: false
  spatial_condition_independent: true
  subject_region: true
  compact_paa: true
  compact_paa_mode: "aligned1"
  condition_layout: "corrected"

train:
  batch_size: 1
  accumulate_grad_batches: 4
  dataloader_workers: 5
  save_interval: 2000
  sample_interval: 2000
  gradient_checkpointing: true
  save_path: "outputs/subject_depth_corrected"
  condition_type: "subject and spatial"
  condition_types:
    - "depth"
  dataset:
    type: "all_high"
    path: "path/to/Allcond200k_high"
    condition_size: 256
    target_size: 512
    image_size: 512
    position_scale: 2.0
    padding: 8
    drop_text_prob: 0.1
    drop_image_prob: 0.1
    total_condition_slots: 1
  wandb:
    project: "OminiControl"
  lora_config:
    r: 4
    lora_alpha: 4
    init_lora_weights: "gaussian"
    target_modules: "(.*x_embedder|.*(?<!single_)transformer_blocks\\.[0-9]+\\.norm1\\.linear|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_k|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_q|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_v|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_out\\.0|.*(?<!single_)transformer_blocks\\.[0-9]+\\.ff\\.net\\.2|.*single_transformer_blocks\\.[0-9]+\\.norm\\.linear|.*single_transformer_blocks\\.[0-9]+\\.proj_mlp|.*single_transformer_blocks\\.[0-9]+\\.proj_out|.*single_transformer_blocks\\.[0-9]+\\.attn.to_k|.*single_transformer_blocks\\.[0-9]+\\.attn.to_q|.*single_transformer_blocks\\.[0-9]+\\.attn.to_v|.*single_transformer_blocks\\.[0-9]+\\.attn.to_out)"
  optimizer:
    type: "Prodigy"
    params:
      lr: 1
      use_bias_correction: true
      safeguard_warmup: true
      weight_decay: 0.01

training_strategy:
  - name: "corrected-layout subject+depth compact aligned1 20k rank4 accum4"
    min_conditions: 1
    max_conditions: 1
    threshold_step: 20000
